# PROJECT_ID placeholders are overridden at install time with --set (see README step 4).
image:
  repository: us-west1-docker.pkg.dev/PROJECT_ID/apps/hello-api
  tag: v1
  pullPolicy: IfNotPresent

containerPort: 8080
livenessPath: /healthz
replicaCount: 2

serviceAccount:
  name: hello-api
  gcpServiceAccount: hello-api@PROJECT_ID.iam.gserviceaccount.com

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
